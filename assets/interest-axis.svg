<svg xmlns="http://www.w3.org/2000/svg" width="14" height="150" viewBox="26.5 13 14 150" role="img" aria-labelledby="title description">
  <title id="title">Relative interest</title>
  <desc id="description">Interest is higher toward the top of the existing topic list and lower toward the bottom. No numerical scores are assigned.</desc>
  <defs>
    <linearGradient id="interest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.45" stop-color="#628BF1"/>
      <stop offset="1" stop-color="#DDE7F8"/>
    </linearGradient>
  </defs>

  <rect x="29" y="23" width="9" height="138" rx="4.5" fill="url(#interest)"/>
</svg>
